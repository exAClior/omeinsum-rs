[package]
name = "omeinsum-cli"
version = "0.1.1"
edition = "2021"
description = "CLI for Einstein summation optimization and contraction"
license = "MIT OR Apache-2.0"

[[bin]]
name = "omeinsum"
path = "src/main.rs"

[dependencies]
omeinsum = { path = ".." }
# Must track the lib's omeco exactly (shared NestedEinsum types across the
# lib boundary); see the comment in the root Cargo.toml.
omeco = { git = "https://github.com/exAClior/omeco.git", rev = "994edd78b29111a444c09e37568b76231423f613" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = { version = "0.4", features = ["serde"] }
num-traits = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
