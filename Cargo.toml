[package]
name = "omeinsum"
version = "0.1.1"
edition = "2021"
authors = ["Jinguo Liu <cacate0129@gmail.com>"]
description = "High-performance Einstein summation with tropical and standard algebra support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensor4all/omeinsum-rs"
keywords = ["einsum", "tensor", "tropical", "autodiff", "contraction"]
categories = ["science", "mathematics"]

# Native library requirements (for CUDA feature)
# cuTENSOR is linked via build.rs when cuda feature is enabled
[package.metadata.native-deps]
cutensor = { version = ">=2.0.0", note = "Required for cuda feature. Version 1.x uses incompatible API." }

[dependencies]
# Core
num-traits = "0.2"
bytemuck = { version = "1.14", features = ["derive"] }
num-complex = { version = "0.4", features = ["bytemuck"] }

# High-performance GEMM for Standard algebra
faer = "0.24"

# Contraction order optimization. Pinned to exAClior/omeco (green-sa branch)
# for the GreenAnnealer second-stage optimizer (RealifyTN campaign W2).
omeco = { git = "https://github.com/exAClior/omeco.git", rev = "193b3bb" }

# Optional: Tropical algebra support. tropical-gemm and tropical-gemm-cuda must
# resolve to the same crate version so the CPU and GPU tropical paths share one
# set of semiring types (otherwise `TropicalMaxPlus<f32>` from each is a distinct,
# incompatible type). 0.3.0 carries the column-major host API plus the forward
# strided-batched GPU kernel used by the CUDA device path.
tropical-gemm = { version = "0.3", optional = true }

# Optional: CUDA support. tropical-gemm-cuda 0.3.0 depends on tropical-gemm 0.3.0
# and cudarc ^0.19.7 — the cudarc pin below mirrors that exact requirement so
# cargo unifies them into a single device/storage layer.
tropical-gemm-cuda = { version = "0.3", optional = true }
# cudarc 0.19.x is required to share a device zero-copy with tropical-gemm-cuda
# (pre-1.0 semver: the exact minor must match the dep's). Feature set mirrors the
# dep so cargo unifies them into a single build.
cudarc = { version = "0.19.7", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-version-from-build-system", "fallback-latest"], optional = true }

# Optional: Parallelism
rayon = { version = "1.8", optional = true }

[dev-dependencies]
rand = "0.9"
approx = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
criterion = { version = "0.5", features = ["html_reports"] }

[features]
# Default: minimal, just Standard algebra
default = []

# Tropical algebra types with optimized SIMD kernels
tropical = ["dep:tropical-gemm"]

# Optimized SIMD kernels for tropical operations (kept for backward compatibility)
tropical-kernels = ["tropical"]

# Parallel execution
parallel = ["rayon"]

# CUDA backend for standard algebra via cuTENSOR (requires cuTENSOR 2.0+, see
# package.metadata.native-deps).
cuda = ["dep:cudarc"]

# Tropical contractions on GPU via tropical-gemm-cuda. Independent of cuTENSOR:
# brings the cudarc device/storage layer + the tropical GPU kernels, so it builds
# and runs without libcutensor present.
cuda-tropical = ["dep:cudarc", "tropical", "dep:tropical-gemm-cuda"]

# Experimental single-NPU Ascend backend via CANN 8.5 ACL/ACLNN.
ascend = []

# Fused f32 MaxPlus/MinPlus/MaxMul kernels with u32 argmax tracking.
ascend-tropical = ["ascend", "tropical"]

# Convenience: all features
full = ["tropical", "cuda", "cuda-tropical", "ascend", "ascend-tropical"]

[[example]]
name = "basic_einsum"
path = "examples/basic_einsum.rs"
required-features = ["tropical"]

[[example]]
name = "tropical_network"
path = "examples/tropical_network.rs"
required-features = ["tropical"]

[[example]]
name = "tropical_network_gpu"
path = "examples/tropical_network_gpu.rs"
required-features = ["cuda-tropical"]

[[example]]
name = "ascend_smoke"
path = "examples/ascend_smoke.rs"
required-features = ["ascend"]

[[example]]
name = "ascend_study"
path = "examples/ascend_study.rs"
required-features = ["ascend-tropical"]

[[example]]
name = "realify_ascend_study"
path = "examples/realify_ascend_study.rs"
required-features = ["ascend"]

[[example]]
name = "network_benchmark"
path = "examples/network_benchmark.rs"

[workspace]
members = [".", "omeinsum-cli"]

[[bench]]
name = "binary"
harness = false

[[bench]]
name = "complex_tdvp"
harness = false

[[bench]]
name = "realify"
harness = false

[[bench]]
name = "network"
harness = false
